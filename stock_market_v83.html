<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="A股实时看盘、分时与多周期K线">
  <title>个股看盘</title>
  <style>
    :root{--bg:#eef2f5;--paper:#fff;--ink:#17212b;--dim:#6c7785;--line:#dce3e8;--blue:#1268a8;--blue-soft:#eaf4fb;--red:#c92d32;--green:#178052;--amber:#9b6411}
    *{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,a{font:inherit}.app{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:14px 0 40px}
    .topbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:minmax(250px,420px) 1fr auto;gap:14px;align-items:center;margin-bottom:12px;padding:10px 12px;border:1px solid rgba(207,218,226,.9);border-radius:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}.brand{font-weight:850;letter-spacing:-.02em}.brand small{display:block;color:var(--blue);font-size:9px;letter-spacing:.14em}.search{position:relative}.search input{width:100%;height:40px;padding:0 13px;border:1px solid var(--line);border-radius:7px;outline:0;background:#f8fafb}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,104,168,.1)}.search-drop{position:absolute;left:0;right:0;top:45px;z-index:20;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(40,65,86,.15)}.search-drop[hidden]{display:none}.search-item{display:grid;grid-template-columns:1fr auto;gap:3px 12px;width:100%;padding:9px 11px;border:0;border-bottom:1px solid #edf1f4;background:#fff;text-align:left;cursor:pointer}.search-item:hover,.search-item.active{background:var(--blue-soft)}.search-item span{color:var(--dim);font-size:10px}.search-item b{grid-row:1/3;grid-column:2;align-self:center;color:var(--blue);font-size:11px}.top-actions{display:flex;gap:7px}.btn{display:inline-grid;place-items:center;min-height:38px;padding:0 13px;border:1px solid #afc3d2;border-radius:7px;color:var(--blue);background:#fff;text-decoration:none;cursor:pointer}.btn.primary{border-color:var(--blue);color:#fff;background:var(--blue)}.btn:active{transform:translateY(1px)}
    .hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding:20px 22px 18px;border:1px solid var(--line);border-radius:10px 10px 4px 4px;background:var(--paper)}.eyebrow{color:var(--blue);font-size:10px;font-weight:850;letter-spacing:.15em}.hero h1{margin:4px 0 2px;font-size:29px;line-height:1.2;letter-spacing:-.035em;text-wrap:balance}.hero .code{color:var(--dim);font-size:12px}.price{text-align:right}.price strong{display:block;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}.price span{font-size:14px;font-weight:750}.up{color:var(--red)}.down{color:var(--green)}
    .quote-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;margin-bottom:12px;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;overflow:hidden;background:var(--line)}.quote-cell{min-width:0;padding:9px 11px;background:#fafcfd}.quote-cell span{display:block;color:var(--dim);font-size:9px}.quote-cell b{display:block;overflow:hidden;font-size:14px;font-variant-numeric:tabular-nums;text-overflow:ellipsis;white-space:nowrap}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}.panel{padding:17px 18px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panel-head h2{margin:0;padding-left:10px;border-left:4px solid var(--blue);font-size:17px}.periods{display:flex;flex-wrap:wrap;gap:5px}.periods button{min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:5px;color:var(--dim);background:#fff;cursor:pointer}.periods button.active{border-color:var(--blue);color:#fff;background:var(--blue)}.chart{height:520px;border:1px solid #e4e9ed;border-radius:7px;overflow:hidden}.chart-state{display:grid;place-items:center;height:100%;padding:24px;color:var(--dim);text-align:center}.chart-state button{margin-top:10px}
    .side{display:grid;align-content:start;gap:12px}.metric-list{display:grid}.metric{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid #edf1f4}.metric:last-child{border-bottom:0}.metric span{color:var(--dim);font-size:11px}.metric strong{font-variant-numeric:tabular-nums}.metric small{grid-column:1/-1;color:var(--dim);font-size:9px}.source{margin-top:9px;color:var(--dim);font-size:10px}.notice{padding:11px 12px;border-left:3px solid var(--blue);background:var(--blue-soft);color:#405166;font-size:11px}.error{color:#9d3035;background:#fff1f1;border-left-color:#bd2c31}
    @media(max-width:820px){.app{width:calc(100% - 16px);padding:8px 0 28px}.topbar{position:relative;grid-template-columns:1fr auto;gap:8px;padding:9px}.brand{display:none}.search{grid-column:1}.top-actions{grid-column:2}.top-actions .btn:not(.primary){display:none}.hero{grid-template-columns:1fr auto;padding:16px 13px}.hero h1{font-size:22px}.price strong{font-size:25px}.quote-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.quote-cell{padding:8px}.workspace{grid-template-columns:1fr}.panel{padding:14px 11px}.panel-head{align-items:flex-start;flex-direction:column}.periods{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.periods button{padding:0 4px}.chart{height:430px}.side{grid-template-columns:1fr}.search-drop{position:fixed;left:8px;right:8px;top:58px;max-height:60dvh}.btn{padding:0 10px}.top-actions .primary{min-width:64px}}
    @media(max-width:430px){.quote-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{display:block}.price{margin-top:10px;text-align:left}.chart{height:390px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><small>MARKET DESK</small>个股看盘</div>
      <div class="search"><input id="marketSearch" type="search" placeholder="输入代码或名称，例如 600、浦发银行" autocomplete="off"><div id="marketSearchDrop" class="search-drop" hidden></div></div>
      <div class="top-actions"><a class="btn" href="/portfolio_analysis_workbench">返回观察台</a><button class="btn primary" id="shareMarketBtn" type="button">分享</button></div>
    </header>
    <section class="hero">
      <div><div class="eyebrow">REAL MARKET · 非演示数据</div><h1 id="stockTitle">正在读取个股行情</h1><div class="code" id="stockCode">—</div></div>
      <div class="price"><strong id="latestPrice">—</strong><span id="latestChange">—</span></div>
    </section>
    <section class="quote-grid" id="quoteGrid"></section>
    <div class="workspace">
      <section class="panel">
        <div class="panel-head"><h2>走势与成交</h2><div class="periods" id="periods"><button class="active" data-period="1min">分时</button><button data-period="5min">5分钟</button><button data-period="15min">15分钟</button><button data-period="daily">日K</button><button data-period="weekly">周K</button><button data-period="monthly">月K</button></div></div>
        <div class="chart" id="marketChart"><div class="chart-state">正在连接行情...</div></div>
        <div class="source" id="marketSource">行情数据正在加载</div>
      </section>
      <aside class="side">
        <section class="panel"><div class="panel-head"><h2>技术观察</h2></div><div class="metric-list" id="technicalMetrics"><div class="chart-state">等待行情</div></div></section>
        <section class="panel"><div class="notice">分享链接只包含股票代码，打开时自动读取最新行情，因此无需等待上传。行情用于观察和复盘，不构成投资建议。</div><div class="source" id="shareHint"></div></section>
      </aside>
    </div>
  </main>
  <script>
    const isGithub=location.hostname.endsWith('.github.io');
    const siteRoot=isGithub?`/${location.pathname.split('/').filter(Boolean)[0]}`:'';
    const liveOrigin=isGithub?'https://tianchend.online':location.origin;
    const el=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const number=(value,d=2)=>value==null||!Number.isFinite(Number(value))?'—':Number(value).toFixed(d);
    const pct=value=>value==null||!Number.isFinite(Number(value))?'—':`${Number(value)>=0?'+':''}${Number(value).toFixed(2)}%`;
    const money=value=>{const n=Number(value);if(!Number.isFinite(n))return'—';return Math.abs(n)>=1e8?`${(n/1e8).toFixed(2)}亿`:Math.abs(n)>=1e4?`${(n/1e4).toFixed(2)}万`:n.toFixed(0)};
    const stockCode=()=>String(location.pathname.match(/\/m\/(\d{6})/)?.[1]||new URLSearchParams(location.search).get('code')||'600000').replace(/\D/g,'').slice(-6);
    let currentCode=stockCode(),currentPeriod='1min',chart=null,catalogPromise=null,searchRows=[];
    function loadCatalog(){if(!catalogPromise)catalogPromise=fetch(`${siteRoot}/static_risk/stock_catalog.json`,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('股票目录未加载');return r.json()}).then(x=>x.stocks||[]);return catalogPromise}
    function rankSearch(item,q){const code=String(item.stock_code||''),name=String(item.stock_name||'');if(code===q||name===q)return 0;if(code.startsWith(q))return 1;if(name.startsWith(q))return 2;if(code.includes(q))return 3;return 4}
    function marketSymbol(code){return `${/^(4|8|92)/.test(code)?'bj':/^[569]/.test(code)?'sh':'sz'}${code}`}
    function quoteNumber(values,index,multiplier=1){const value=Number(values?.[index]);return Number.isFinite(value)?value*multiplier:null}
    function normalizeTencentDate(value){const text=String(value||'');return /^\d{12}$/.test(text)?`${text.slice(0,4)}-${text.slice(4,6)}-${text.slice(6,8)} ${text.slice(8,10)}:${text.slice(10,12)}`:text}
    function tencentQuote(values,code,latest={}){return{code,name:String(values?.[1]||code),price:quoteNumber(values,3)??latest.close??null,prev_close:quoteNumber(values,4),open:quoteNumber(values,5)??latest.open??null,change:quoteNumber(values,31),pct_change:quoteNumber(values,32),high:quoteNumber(values,33)??latest.high??null,low:quoteNumber(values,34)??latest.low??null,volume:quoteNumber(values,36)??latest.volume??null,amount:quoteNumber(values,37,10000)??latest.amount??null,turnover:quoteNumber(values,38),pe:quoteNumber(values,39),float_market_cap:quoteNumber(values,44,100000000),market_cap:quoteNumber(values,45,100000000),pb:quoteNumber(values,46)}}
    async function fetchPublicJson(url){const response=await fetch(url,{cache:'no-store',mode:'cors'});if(!response.ok)throw new Error(`公开行情返回 ${response.status}`);return response.json()}
    async function fetchTencentMarket(code,period){const symbol=marketSymbol(code);let url;if(period==='1min')url=`https://ifzq.gtimg.cn/appstock/app/minute/query?code=${symbol}`;else if(period==='5min'||period==='15min')url=`https://ifzq.gtimg.cn/appstock/app/kline/mkline?param=${symbol},m${period.slice(0,-3)},,960`;else url=`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${symbol},${{daily:'day',weekly:'week',monthly:'month'}[period]},,,360,qfq`;const payload=await fetchPublicJson(url),data=payload?.data?.[symbol]||{},quoteValues=data?.qt?.[symbol]||[];let rows=[];if(period==='1min'){const minuteData=data?.data||{},day=String(minuteData.date||'');let previousVolume=0,previousAmount=0;rows=(minuteData.data||[]).map(line=>{const values=String(line).split(' '),price=Number(values[1]),cumulativeVolume=Number(values[2])||previousVolume,cumulativeAmount=Number(values[3])||previousAmount,row={date:`${day.slice(0,4)}-${day.slice(4,6)}-${day.slice(6,8)} ${values[0].slice(0,2)}:${values[0].slice(2,4)}`,open:price,close:price,high:price,low:price,volume:Math.max(0,cumulativeVolume-previousVolume),amount:Math.max(0,cumulativeAmount-previousAmount),amplitude:0,pct_change:null,change:null,turnover:null};previousVolume=cumulativeVolume;previousAmount=cumulativeAmount;return row})}else{const dayKey={daily:'day',weekly:'week',monthly:'month'}[period],key=period==='5min'?'m5':period==='15min'?'m15':`qfq${dayKey}`;rows=(data[key]||data[dayKey]||[]).map(values=>({date:normalizeTencentDate(values[0]),open:Number(values[1]),close:Number(values[2]),high:Number(values[3]),low:Number(values[4]),volume:Number(values[5])||0,amount:Number(values[6])||null,amplitude:null,pct_change:null,change:null,turnover:null}))}rows=rows.filter(row=>row.date&&[row.open,row.close,row.high,row.low].every(Number.isFinite));if(!rows.length&&(period==='5min'||period==='15min')){const minute=await fetchTencentMarket(code,'1min'),size=period==='5min'?5:15;for(let index=0;index<minute.rows.length;index+=size){const bucket=minute.rows.slice(index,index+size);if(bucket.length)rows.push({date:bucket.at(-1).date,open:bucket[0].open,close:bucket.at(-1).close,high:Math.max(...bucket.map(row=>row.high)),low:Math.min(...bucket.map(row=>row.low)),volume:bucket.reduce((sum,row)=>sum+(Number(row.volume)||0),0),amount:bucket.reduce((sum,row)=>sum+(Number(row.amount)||0),0),amplitude:null,pct_change:null,change:null,turnover:null})}return{ok:true,code,period,period_label:period==='5min'?'5分钟':'15分钟',quote:minute.quote,rows,source:'腾讯证券公开行情接口（分时聚合）',is_demo:false,fetched_at:new Date().toISOString()}}if(!rows.length)throw new Error('公开行情暂未返回该股票数据');return{ok:true,code,period,period_label:{'1min':'1分钟','5min':'5分钟','15min':'15分钟',daily:'日K',weekly:'周K',monthly:'月K'}[period],quote:tencentQuote(quoteValues,code,rows.at(-1)),rows,source:'腾讯证券公开行情接口',is_demo:false,fetched_at:new Date().toISOString()}}
    async function searchStocks(query){const q=String(query||'').trim().toLowerCase(),drop=el('marketSearchDrop');if(!q){drop.hidden=true;return}drop.hidden=false;drop.innerHTML='<div class="chart-state">正在查找股票...</div>';try{const stocks=await loadCatalog();searchRows=stocks.filter(item=>String(item.stock_code||'').includes(q)||String(item.stock_name||'').toLowerCase().includes(q)).sort((a,b)=>rankSearch(a,q)-rankSearch(b,q)||String(a.stock_code).localeCompare(String(b.stock_code))).slice(0,16);drop.innerHTML=searchRows.length?searchRows.map(item=>`<button class="search-item" data-code="${esc(item.stock_code)}"><div><strong>${esc(item.stock_name||item.stock_code)}</strong><span>${esc(item.stock_code)}${item.industry_name&&item.industry_name!=='未分类'?` · ${esc(item.industry_name)}`:''}</span></div><b>看盘 →</b></button>`).join(''):'<div class="chart-state">没有匹配股票，请检查代码或名称</div>';drop.querySelectorAll('[data-code]').forEach(button=>button.onclick=()=>openStock(button.dataset.code))}catch(error){drop.innerHTML=`<div class="chart-state">${esc(error.message)}</div>`}}
    function openStock(code){const clean=String(code||'').replace(/\D/g,'').slice(-6);if(!/^\d{6}$/.test(clean))return;location.href=isGithub?`${siteRoot}/stock_market.html?code=${clean}`:`/m/${clean}`}
    async function chartLibrary(){if(window.echarts)return window.echarts;await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=`${siteRoot}/echarts.min.js?v=5.5.0`;script.onload=resolve;script.onerror=()=>reject(new Error('图表库加载失败'));document.head.appendChild(script)});return window.echarts}
    function ma(values,window){return values.map((_,i)=>i<window-1?null:Number((values.slice(i-window+1,i+1).reduce((a,b)=>a+b,0)/window).toFixed(3)))}
    function rsi(values,window=14){if(values.length<=window)return null;let gains=0,losses=0;for(let i=values.length-window;i<values.length;i++){const d=values[i]-values[i-1];if(d>=0)gains+=d;else losses-=d}if(!losses)return 100;const rs=(gains/window)/(losses/window);return 100-100/(1+rs)}
    function renderQuote(q){const change=Number(q.pct_change),cls=change>=0?'up':'down';el('stockTitle').textContent=q.name||currentCode;el('stockCode').textContent=`${currentCode} · 实时看盘`;el('latestPrice').textContent=number(q.price);el('latestChange').className=cls;el('latestChange').textContent=`${pct(q.pct_change)}  ${q.change==null?'':number(q.change)}`;const cells=[['今开',number(q.open)],['最高',number(q.high)],['最低',number(q.low)],['昨收',number(q.prev_close)],['换手',q.turnover==null?'—':pct(q.turnover)],['成交额',money(q.amount)],['动态PE',number(q.pe)],['PB',number(q.pb)]];el('quoteGrid').innerHTML=cells.map(([k,v])=>`<div class="quote-cell"><span>${k}</span><b>${v}</b></div>`).join('')}
    function renderMetrics(rows){const closes=rows.map(x=>Number(x.close)).filter(Number.isFinite),latest=closes.at(-1),ma5=ma(closes,5).at(-1),ma20=ma(closes,20).at(-1),ma60=ma(closes,60).at(-1),rsi14=rsi(closes);const metrics=[['价格 / MA5',`${number(latest)} / ${number(ma5)}`,latest>=ma5?'站上短期均线':'位于短期均线下方'],['MA20 / MA60',`${number(ma20)} / ${number(ma60)}`,ma20>=ma60?'中期均线偏强':'中期均线偏弱'],['RSI14',number(rsi14),rsi14>=70?'进入超买区':rsi14<=30?'进入超卖区':'处于中性区'],['数据条数',String(rows.length),'当前周期已返回的有效K线']];el('technicalMetrics').innerHTML=metrics.map(x=>`<div class="metric"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong><small>${esc(x[2])}</small></div>`).join('')}
    async function draw(rows,period){const ec=await chartLibrary(),host=el('marketChart');if(chart)chart.dispose();host.innerHTML='';chart=ec.init(host);const dates=rows.map(x=>x.date),closes=rows.map(x=>Number(x.close)),ohlc=rows.map(x=>[x.open,x.close,x.low,x.high]),volumes=rows.map(x=>x.volume);const intraday=period==='1min';chart.setOption({animation:false,tooltip:{trigger:'axis',axisPointer:{type:'cross'}},legend:{data:intraday?['价格','均价']:['K线','MA5','MA20','MA60'],right:8,top:4,textStyle:{fontSize:10}},grid:[{left:48,right:16,top:38,height:'63%'},{left:48,right:16,top:'80%',height:'10%'}],xAxis:[{type:'category',data:dates,boundaryGap:!intraday,axisLabel:{fontSize:9}},{type:'category',gridIndex:1,data:dates,axisLabel:{show:false}}],yAxis:[{scale:true,splitLine:{lineStyle:{color:'#edf1f4',type:'dashed'}}},{gridIndex:1,scale:true,axisLabel:{show:false},splitLine:{show:false}}],dataZoom:[{type:'inside',xAxisIndex:[0,1],start:period.includes('min')?70:35,end:100},{type:'slider',xAxisIndex:[0,1],start:period.includes('min')?70:35,end:100,height:14,bottom:0}],series:intraday?[{name:'价格',type:'line',data:closes,showSymbol:false,lineStyle:{width:1.6,color:'#1268a8'},areaStyle:{color:'rgba(18,104,168,.08)'}},{name:'均价',type:'line',data:ma(closes,20),showSymbol:false,lineStyle:{width:1,color:'#b57c20'}},{name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:volumes,itemStyle:{color:'#9aacb9'}}]:[{name:'K线',type:'candlestick',data:ohlc,itemStyle:{color:'#c92d32',color0:'#178052',borderColor:'#c92d32',borderColor0:'#178052'}},{name:'MA5',type:'line',data:ma(closes,5),showSymbol:false,lineStyle:{width:1,color:'#b57c20'}},{name:'MA20',type:'line',data:ma(closes,20),showSymbol:false,lineStyle:{width:1.2,color:'#3567c8'}},{name:'MA60',type:'line',data:ma(closes,60),showSymbol:false,lineStyle:{width:1.2,color:'#5eae55'}},{name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:volumes,itemStyle:{color:'#9aacb9'}}]});renderMetrics(rows)}
    async function loadMarket(period=currentPeriod){currentPeriod=period;document.querySelectorAll('[data-period]').forEach(b=>b.classList.toggle('active',b.dataset.period===period));el('marketChart').innerHTML='<div class="chart-state">正在读取真实行情...</div>';try{let payload;if(isGithub){payload=await fetchTencentMarket(currentCode,period)}else{try{const response=await fetch(`${liveOrigin}/api/stock-live?code=${encodeURIComponent(currentCode)}&period=${encodeURIComponent(period)}`,{cache:'no-store'});payload=await response.json();if(!response.ok||!payload.ok)throw new Error(payload.error||'行情加载失败')}catch(_){payload=await fetchTencentMarket(currentCode,period)}}renderQuote(payload.quote||{});await draw(payload.rows||[],period);el('marketSource').textContent=`${payload.source} · ${payload.period_label} · ${payload.rows.length} 条 · ${new Date(payload.fetched_at).toLocaleString('zh-CN')}`;el('shareHint').textContent='当前公开链接可直接发送给任何人，不依赖 Vercel。'}catch(error){el('marketChart').innerHTML=`<div class="chart-state"><div><strong>行情暂时没有加载出来</strong><p>${esc(error.message||error)}</p><button class="btn" id="retryMarket" type="button">重新加载</button></div></div>`;el('marketSource').textContent='未使用演示数据';el('retryMarket')?.addEventListener('click',()=>loadMarket(period))}}
    async function shareMarket(){const url=`https://senyoasuka.github.io/tcd-share/stock_market_v83.html?code=${currentCode}`;const title=`${el('stockTitle').textContent}（${currentCode}）实时看盘`;try{if(navigator.share){await navigator.share({title,text:'个股实时行情与多周期K线',url});el('shareHint').textContent='已打开手机分享面板'}else{await navigator.clipboard.writeText(url);el('shareHint').textContent='公开分享链接已复制'} }catch(error){if(error.name!=='AbortError'){el('shareHint').innerHTML=`请复制链接：<a href="${url}">${url}</a>`}}}
    let searchTimer;el('marketSearch').addEventListener('input',event=>{clearTimeout(searchTimer);const value=event.currentTarget.value;el('marketSearchDrop').hidden=false;el('marketSearchDrop').innerHTML=value.trim()?'<div class="chart-state">正在查找股票...</div>':'<div class="chart-state">输入代码或股票名称</div>';searchTimer=setTimeout(()=>searchStocks(value),80)});el('marketSearch').addEventListener('focus',event=>{if(event.currentTarget.value.trim())searchStocks(event.currentTarget.value)});document.addEventListener('click',event=>{if(!event.target.closest('.search'))el('marketSearchDrop').hidden=true});el('shareMarketBtn').onclick=shareMarket;el('periods').addEventListener('click',event=>{const button=event.target.closest('[data-period]');if(button)loadMarket(button.dataset.period)});addEventListener('resize',()=>chart?.resize(),{passive:true});loadCatalog().catch(()=>{});loadMarket();
  </script>
