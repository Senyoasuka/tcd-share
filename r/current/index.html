<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="股票组合持仓与风控只读快照">
  <meta name="color-scheme" content="light">
  <title>持仓与风控快照</title>
  <style>
    :root{--bg:#f3f5f7;--paper:#fff;--line:#e2e7ec;--ink:#17202a;--dim:#697586;--accent:#1769aa;--accent-soft:#edf6fd;--red:#c62828;--green:#26734d}
    *{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    button,a{font:inherit}.wrap{width:min(980px,calc(100% - 32px));margin:0 auto;padding:18px 0 48px}
    .masthead,.sheet,.foot{background:var(--paper);border:1px solid var(--line);border-radius:8px}
    .masthead{padding:22px 24px;margin-bottom:14px}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
    .eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.13em}.title{margin:5px 0 2px;font-size:25px;line-height:1.3}.sub,.muted{color:var(--dim);font-size:12px}
    .actions{display:flex;gap:8px;flex:0 0 auto}.actions button,.actions a{display:grid;place-items:center;min-height:36px;padding:0 13px;border:1px solid #b8c7d5;border-radius:6px;background:#fff;color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}.actions .primary{border-color:var(--accent);background:var(--accent);color:#fff}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:19px;overflow:hidden;border:1px solid var(--line);border-radius:7px;background:var(--line)}.metric{min-width:0;padding:12px 14px;background:#fafcfd}.metric .k{color:var(--dim);font-size:12px}.metric .v{margin:2px 0;font-size:22px;font-weight:750;line-height:1.25;font-variant-numeric:tabular-nums}.metric .n{color:var(--dim);font-size:11px}.metric.warn{background:#fff7ea}.metric.safe{background:#f0f8f3}.metric.defensive{background:#f2f7fb}
    .sheet{padding:19px 22px;margin-bottom:14px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:13px}.section-title h2{margin:0;padding-left:11px;border-left:4px solid var(--accent);font-size:18px;line-height:1.3}.section-title span{color:var(--dim);font-size:12px}
    .lead{margin:0 0 14px;padding:11px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);color:#334155}.lead b{color:var(--ink)}
    .holdings{overflow:hidden;border:1px solid var(--line);border-radius:7px}.holding{display:grid;grid-template-columns:minmax(160px,1.4fr) repeat(3,minmax(86px,.55fr));align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line)}.holding:last-child{border:0}.holding>div{min-width:0}.holding strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.holding span,.holding small{display:block;color:var(--dim);font-size:11px}.holding b{font-variant-numeric:tabular-nums}.up{color:var(--red)}.down{color:var(--green)}
    .chart-wrap{position:relative}.chart{width:100%;height:370px;border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden}.chart-loading{position:absolute;right:10px;top:9px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--dim);font-size:10px}.chart-status{display:grid;place-items:center;height:100%;color:var(--dim);font-size:13px}.preview{display:block;width:100%;height:100%}.preview-grid{stroke:#edf0f3;stroke-width:1}.preview-line{fill:none;stroke:var(--accent);stroke-width:2.2;vector-effect:non-scaling-stroke}.preview-area{fill:url(#fade)}
    .analysis-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.analysis-grid .sheet{margin:0}.note{min-height:118px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);white-space:pre-line}.drivers{display:grid;gap:8px}.driver{display:grid;grid-template-columns:23px 1fr;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);color:#435064;font-size:13px}.driver:last-child{border-bottom:0}.driver b{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px}.driver strong{display:block;color:var(--ink);font-size:13px}.empty{display:grid;place-items:center;min-height:104px;color:var(--dim);text-align:center}.source{margin-top:9px;color:var(--dim);font-size:10px}.foot{margin-top:14px;padding:14px 18px;color:var(--dim);font-size:11px}.error{max-width:680px;margin:70px auto;padding:26px}.error a{color:var(--accent)}
    .sector-tools{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.sector-tools input{width:min(320px,100%);height:36px;padding:0 11px;border:1px solid var(--line);border-radius:6px}.sector-layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:520px;border:1px solid var(--line);border-radius:7px;overflow:hidden}.sector-list{max-height:620px;overflow:auto;border-right:1px solid var(--line);background:#f8fafc}.sector-list button{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:7px;width:100%;min-height:48px;padding:7px 9px;border:0;border-bottom:1px solid var(--line);background:transparent;color:#334155;text-align:left;cursor:pointer}.sector-list button.active{box-shadow:inset 3px 0 var(--accent);background:#eaf3fc}.sector-list button>span{color:#94a3b8;font-size:10px}.sector-list button strong{overflow:hidden;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.sector-list button small{color:var(--dim);font-size:9px}.sector-list button b{font-size:10px;white-space:nowrap}.sector-detail{min-width:0;padding:13px}.sector-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:10px;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--line)}.sector-summary div{padding:8px 9px;background:#fff}.sector-summary span{display:block;color:var(--dim);font-size:9px}.sector-summary strong{font-size:13px}.sector-chart{height:300px;border:1px solid var(--line);border-radius:6px}.strong-head{display:flex;justify-content:space-between;margin:13px 0 7px}.strong-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.strong-stock{display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;color:inherit;text-decoration:none}.strong-stock:hover{border-color:#9ab7d0;background:var(--accent-soft)}.strong-stock strong{font-size:12px}.strong-stock span,.strong-stock small{color:var(--dim);font-size:9px}.strong-stock b{color:var(--red);font-size:11px}.strong-stock small{grid-column:1/-1}
    @media(max-width:680px){body{overflow-x:hidden}.wrap{width:calc(100% - 18px);padding:9px 0 32px}.masthead{padding:16px 13px}.topline{display:block}.title{font-size:21px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:13px;width:100%}.actions button,.actions a{min-width:0;padding:0 7px;white-space:nowrap}.metrics{grid-template-columns:1fr 1fr;margin-top:14px}.metric{padding:10px}.metric .v{font-size:19px}.sheet{padding:15px 12px}.section-title{align-items:flex-start;flex-direction:column;gap:2px}.section-title h2{font-size:17px}.holding{grid-template-columns:1fr 1fr;gap:7px;padding:10px 6px}.holding>div:first-child{grid-column:1/-1}.chart{height:300px}.analysis-grid{grid-template-columns:1fr;gap:12px}.lead{font-size:13px}.foot{margin-top:12px;border-radius:7px}.sector-layout{grid-template-columns:1fr}.sector-list{display:flex;max-height:none;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.sector-list button{flex:0 0 150px;grid-template-columns:20px 1fr;min-height:58px}.sector-list button b{grid-column:2}.sector-summary{grid-template-columns:1fr 1fr}.sector-detail{padding:9px}.sector-chart{height:270px}.strong-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap" id="app"><div class="empty">正在读取持仓快照...</div></main>
  <script>
    const app=document.getElementById('app');
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const num=(value,digits=1)=>value==null||Number.isNaN(Number(value))?'—':Number(value).toFixed(digits);
    const pct=(value,digits=1)=>value==null||Number.isNaN(Number(value))?'—':`${Number(value)>=0?'+':''}${Number(value).toFixed(digits)}%`;
    const decode=value=>{const normalized=value.replace(/-/g,'+').replace(/_/g,'/');const binary=atob(normalized+'='.repeat((4-normalized.length%4)%4));return JSON.parse(new TextDecoder().decode(Uint8Array.from(binary,char=>char.charCodeAt(0))))};
    const encode=value=>{const bytes=new TextEncoder().encode(JSON.stringify(value));let binary='';bytes.forEach(byte=>{binary+=String.fromCharCode(byte)});return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')};
    const isGithub=location.hostname.endsWith('.github.io');
    const siteRoot=isGithub?`/${location.pathname.split('/').filter(Boolean)[0]}`:'';
    const homeUrl=isGithub?`${siteRoot}/`:`${siteRoot}/portfolio_analysis_workbench?tab=risk`;

    function snapshotId(){const fromQuery=new URLSearchParams(location.search).get('id');const fromPath=location.pathname.match(/\/r\/([a-zA-Z0-9_-]+)/)?.[1];return String(fromQuery||fromPath||'').replace(/[^a-zA-Z0-9_-]/g,'')}
    async function loadSnapshot(){const encoded=new URLSearchParams(location.hash.replace(/^#/,'')).get('data');if(encoded)return decode(encoded);const id=snapshotId();if(!id)throw new Error('链接中没有可读取的快照');const response=await fetch(`${siteRoot}/static_risk/shares/${id}.json`,{cache:'no-store'});if(!response.ok)throw new Error('这份快照不存在或尚未发布');return response.json()}
    async function loadIndex(snapshot){if(snapshot.index?.dates?.length)return snapshot.index;try{const response=await fetch(`${siteRoot}/static_risk/workspace.json`,{cache:'no-store'});if(!response.ok)return null;return (await response.json()).indices?.[0]||null}catch(_){return null}}

    let chartLibraryPromise;
    function preloadChartLibrary(){const link=document.createElement('link');link.rel='preload';link.as='script';link.href=`${siteRoot}/echarts.min.js?v=5.5.0`;document.head.appendChild(link)}
    function loadChartLibrary(){if(window.echarts)return Promise.resolve(window.echarts);if(chartLibraryPromise)return chartLibraryPromise;chartLibraryPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=`${siteRoot}/echarts.min.js?v=5.5.0`;script.async=true;script.onload=()=>window.echarts?resolve(window.echarts):reject(new Error('图表库未正确加载'));script.onerror=()=>reject(new Error('图表库加载失败'));document.head.appendChild(script)});return chartLibraryPromise}
    preloadChartLibrary();

    function gapMeta(total,risk){if(!Number.isFinite(risk))return{gap:null,label:'等待大盘风控分',className:''};const gap=total-risk;if(gap>15)return{gap,label:'仓位明显高于市场安全分',className:'warn'};if(gap>5)return{gap,label:'仓位略高于市场安全分',className:'warn'};if(gap>=-5)return{gap,label:'仓位与市场安全分接近',className:'safe'};return{gap,label:'仓位低于市场安全分',className:'defensive'}}
    function holdingRow(item){return `<article class="holding"><div><strong>${esc(item.stock_name||item.stock_code)}</strong><span>${esc(item.stock_code)}${item.industry_name?` · ${esc(item.industry_name)}`:''}</span></div><div><small>个股仓位</small><b>${num(item.position_pct,1)}%</b></div><div><small>持仓收益</small><b class="${Number(item.return_pct)>=0?'up':'down'}">${pct(item.return_pct)}</b></div><div><small>风控分</small><b>${num(item.risk_score,1)}</b></div></article>`}
    function driverRow(item,index){const name=typeof item==='string'?'风控观察':(item.factor_name||item.name||'风控观察');const detail=typeof item==='string'?item:(item.explanation||item.display_value||'');return `<div class="driver"><b>${index+1}</b><div><strong>${esc(name)}</strong><span>${esc(detail)}</span></div></div>`}
    function previewChart(index){const closes=(index?.ohlc||[]).map(row=>Number(row?.[1])).filter(Number.isFinite).slice(-70);if(closes.length<2)return '<div class="chart-status">正在准备图表...</div>';const min=Math.min(...closes),max=Math.max(...closes),span=max-min||1;const points=closes.map((value,i)=>`${(i/(closes.length-1)*900).toFixed(1)},${(245-(value-min)/span*190).toFixed(1)}`).join(' ');return `<svg class="preview" viewBox="0 0 900 280" preserveAspectRatio="none" aria-label="指数走势预览"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1769aa" stop-opacity=".2"/><stop offset="1" stop-color="#1769aa" stop-opacity="0"/></linearGradient></defs><path class="preview-grid" d="M0 55H900M0 120H900M0 185H900M0 250H900"/><polygon class="preview-area" points="0,260 ${points} 900,260"/><polyline class="preview-line" points="${points}"/></svg>`}
    async function drawChart(index){const host=document.getElementById('marketChart');if(!host||!index?.dates?.length)return;try{const charts=await loadChartLibrary();host.innerHTML='';document.getElementById('chartLoading')?.remove();const chart=charts.init(host);chart.setOption({animation:false,tooltip:{trigger:'axis',axisPointer:{type:'cross'}},legend:{data:['K线','MA5','MA20'],top:2,right:6,textStyle:{fontSize:10}},grid:[{left:48,right:14,top:36,height:'61%'},{left:48,right:14,top:'78%',height:'10%'}],xAxis:[{type:'category',data:index.dates,boundaryGap:true,axisLabel:{fontSize:9}},{type:'category',gridIndex:1,data:index.dates,axisLabel:{show:false}}],yAxis:[{scale:true,axisLabel:{fontSize:9},splitLine:{lineStyle:{color:'#edf1f5',type:'dashed'}}},{gridIndex:1,axisLabel:{show:false},splitLine:{show:false}}],dataZoom:[{type:'inside',xAxisIndex:[0,1],start:45,end:100},{type:'slider',xAxisIndex:[0,1],start:45,end:100,height:14,bottom:0}],series:[{name:'K线',type:'candlestick',data:index.ohlc||[],itemStyle:{color:'#c62828',color0:'#26734d',borderColor:'#c62828',borderColor0:'#26734d'}},{name:'MA5',type:'line',data:index.ma5||[],showSymbol:false,lineStyle:{width:1.3,color:'#d97706'}},{name:'MA20',type:'line',data:index.ma20||[],showSymbol:false,lineStyle:{width:1.3,color:'#2563eb'}},{name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:index.volumes||[],itemStyle:{color:'#94a3b8'}}]});addEventListener('resize',()=>chart.resize(),{passive:true})}catch(error){const badge=document.getElementById('chartLoading');if(badge)badge.textContent='交互图表加载失败，已保留走势预览'}}

    let sectors=[],stockShareManifest={stocks:{}};
    function stockLink(item){const code=String(item.code||'').replace(/\D/g,'').slice(-6);return isGithub?`${siteRoot}/stock_market_v84.html?code=${encodeURIComponent(code)}`:`/m/${encodeURIComponent(code)}`}
    async function drawSectorChart(kline){const host=document.getElementById('sectorChart');if(!host||!kline?.dates?.length)return;host.innerHTML=previewChart(kline);try{const ec=await loadChartLibrary();host.innerHTML='';const chart=ec.init(host);chart.setOption({animation:false,tooltip:{trigger:'axis',axisPointer:{type:'cross'}},grid:{left:48,right:12,top:24,bottom:36},xAxis:{type:'category',data:kline.dates,axisLabel:{fontSize:9}},yAxis:{scale:true,splitLine:{lineStyle:{color:'#edf0f3',type:'dashed'}}},dataZoom:[{type:'inside',start:55,end:100},{type:'slider',start:55,end:100,height:13,bottom:3}],series:[{type:'candlestick',data:kline.ohlc||[],itemStyle:{color:'#c62828',color0:'#26734d',borderColor:'#c62828',borderColor0:'#26734d'}},{type:'line',data:kline.ma5||[],showSymbol:false,lineStyle:{width:1.2,color:'#d97706'}},{type:'line',data:kline.ma20||[],showSymbol:false,lineStyle:{width:1.2,color:'#2563eb'}}]});addEventListener('resize',()=>chart.resize(),{passive:true})}catch(_){}}
    async function selectSector(code){
      document.querySelectorAll('[data-sector]').forEach(button=>button.classList.toggle('active',button.dataset.sector===code));
      const target=document.getElementById('sectorDetail');target.innerHTML='<div class="empty">正在读取行业 K 线与强势个股...</div>';
      try{const response=await fetch(`${siteRoot}/static_risk/sectors/${encodeURIComponent(code)}.json`,{cache:'no-store'});if(!response.ok)throw new Error('行业快照未发布');const d=await response.json(),s=d.sector||{},stocks=d.strong_stocks||[];target.innerHTML=`<div class="sector-summary"><div><span>申万二级行业</span><strong>${esc(s.industry_name||code)}</strong></div><div><span>连续站上 MA5</span><strong>${s.above_ma5_days==null?'—':`${s.above_ma5_days} 天`}</strong></div><div><span>RSI14</span><strong>${num(s.rsi14,2)}</strong></div><div><span>当日涨跌</span><strong>${pct(s.latest_pct,2)}</strong></div></div><div id="sectorChart" class="sector-chart"><div class="chart-status">正在准备行业图表...</div></div><div class="strong-head"><strong>强势个股</strong><span class="muted">扫描 ${d.scanned_count||0} / ${d.constituent_count||0} 只</span></div><div class="strong-list">${stocks.length?stocks.map(item=>`<a class="strong-stock" href="${stockLink(item,s)}" target="_blank" rel="noopener"><div><strong>${esc(item.name||item.code)}</strong><span>${esc(item.code)}</span></div><b>最高 +${num(item.max_gain_pct,2)}%</b><small>${item.limit_up_dates?.length?`涨停 ${item.limit_up_dates.length} 次 · 最近 ${esc(item.limit_up_dates[0])}`:`5%以上 ${item.strong_days?.length||0} 次`} · RSI ${num(item.rsi14,2)}</small></a>`).join(''):'<div class="empty">近期暂无涨幅达到 5% 的已扫描标的</div>'}</div><div class="source">数据来源：${esc(d.source||s.rsi_source||'行业静态快照')}${d.partial?` · 部分数据更新失败`:''}</div>`;drawSectorChart(d.kline)}catch(error){target.innerHTML=`<div class="empty">${esc(error.message||error)}</div>`}
    }
    function renderSectorList(rows){const query=String(document.getElementById('sectorSearch')?.value||'').trim();const filtered=rows.filter(item=>!query||String(item.industry_name||'').includes(query)||String(item.industry_code||'').includes(query));document.getElementById('sectorList').innerHTML=filtered.map((item,index)=>`<button type="button" data-sector="${esc(item.industry_code)}"><span>${index+1}</span><div><strong>${esc(item.industry_name)}</strong><small>${esc(item.industry_code)}</small></div><b>${item.above_ma5_days==null?'—':`${item.above_ma5_days}天`} · RSI ${num(item.rsi14,1)}</b></button>`).join('')||'<div class="empty">没有匹配行业</div>';document.querySelectorAll('[data-sector]').forEach(button=>button.onclick=()=>selectSector(button.dataset.sector));if(filtered.length)selectSector(filtered[0].industry_code)}
    async function loadSectors(){try{const [workspaceResponse,manifestResponse]=await Promise.all([fetch(`${siteRoot}/static_risk/workspace.json`,{cache:'no-store'}),fetch(`${siteRoot}/static_risk/stock_share_manifest.json`,{cache:'no-store'}).catch(()=>null)]);if(!workspaceResponse.ok)throw new Error('行业工作区未发布');const workspace=await workspaceResponse.json();if(manifestResponse?.ok)stockShareManifest=await manifestResponse.json();sectors=(workspace.sectors||[]).filter(item=>item.available).sort((a,b)=>(b.above_ma5_days??-1)-(a.above_ma5_days??-1));renderSectorList(sectors);document.getElementById('sectorSearch').oninput=()=>renderSectorList(sectors)}catch(error){document.getElementById('sectorDetail').innerHTML=`<div class="empty">${esc(error.message||error)}</div>`}}

    async function render(snapshot){
      const holdings=snapshot.position?.holdings||[];
      const total=holdings.reduce((sum,item)=>sum+Number(item.position_pct||0),0);
      const riskValue=Number(snapshot.market?.score),risk=Number.isFinite(riskValue)?riskValue:null;
      const meta=gapMeta(total,risk),breadth=snapshot.market?.breadth_summary||{};
      const showBreadth=Boolean(breadth.source)&&Number.isFinite(Number(breadth.advancers))&&Number.isFinite(Number(breadth.decliners));
      const drivers=(snapshot.market?.key_drivers||[]).slice(0,4);
      const note=String(snapshot.position?.manager_note||'').trim()||'当日暂未填写主理人说明。';
      document.title=`${snapshot.portfolio_name||'股票组合'} 持仓与风控快照`;
      app.innerHTML=`<header class="masthead"><div class="topline"><div><div class="eyebrow">PORTFOLIO SNAPSHOT · 只读</div><h1 class="title">${esc(snapshot.portfolio_name||'股票组合观察台')}</h1><div class="sub">快照日期 ${esc(snapshot.snapshot_date||'—')} · 分享后数据不再变动</div></div><div class="actions"><button id="copyLink" class="primary">复制链接</button><a href="${homeUrl}">${isGithub?'查看最新快照':'返回观察台'}</a></div></div><div class="metrics"><div class="metric"><div class="k">大盘风控分</div><div class="v">${num(risk,1)}</div><div class="n">与观察台当天保存值一致</div></div><div class="metric"><div class="k">主理人总仓位</div><div class="v">${num(total,1)}%</div><div class="n">${holdings.length} 只持仓</div></div><div class="metric ${meta.className}"><div class="k">仓位 − 风控分</div><div class="v">${meta.gap==null?'—':`${meta.gap>=0?'+':''}${num(meta.gap,1)}`}</div><div class="n">${meta.label}</div></div>${showBreadth?`<div class="metric"><div class="k">上涨 / 下跌</div><div class="v">${num(breadth.advancers,0)} / ${num(breadth.decliners,0)}</div><div class="n">当日市场宽度</div></div>`:''}</div></header>
      <section class="sheet"><div class="section-title"><h2>一、组合与仓位</h2><span>以分享时数据为准</span></div><p class="lead">当前总仓位 <b>${num(total,1)}%</b>，大盘风控分 <b>${num(risk,1)}</b>，仓位与风控分相差 <b>${meta.gap==null?'—':`${meta.gap>=0?'+':''}${num(meta.gap,1)}`}</b>。${esc(meta.label)}。</p><div class="holdings">${holdings.length?holdings.map(holdingRow).join(''):'<div class="empty">该快照没有登记股票持仓</div>'}</div></section>
      <section class="sheet"><div class="section-title"><h2>二、大盘走势</h2><span id="chartLabel">当天静态行情快照</span></div><div class="chart-wrap"><div id="marketChart" class="chart"><div class="chart-status">正在准备图表...</div></div><div id="chartLoading" class="chart-loading">交互图表加载中</div></div>${showBreadth?`<div class="source">市场宽度来源：${esc(breadth.source)}</div>`:''}</section>
      <div class="analysis-grid"><section class="sheet"><div class="section-title"><h2>三、主理人说明</h2></div><div class="note">${esc(note)}</div></section><section class="sheet"><div class="section-title"><h2>四、风控信号</h2></div><div class="drivers">${drivers.length?drivers.map(driverRow).join(''):'<div class="empty">暂无额外风控信号</div>'}</div></section></div>
      <section class="sheet" style="margin-top:14px"><div class="section-title"><h2>五、申万二级行业全景</h2><span>全部行业排名 · K线 · RSI · 强势个股</span></div><div class="sector-tools"><input id="sectorSearch" type="search" placeholder="搜索行业名称或代码"><span class="muted">点击强势个股进入个股分析</span></div><div class="sector-layout"><div id="sectorList" class="sector-list"><div class="empty">正在读取全部行业...</div></div><div id="sectorDetail" class="sector-detail"><div class="empty">请选择行业</div></div></div></section>
      <footer class="foot"><strong>风险提示：</strong>${esc(snapshot.disclaimer||'本页仅供信息记录与复盘，不构成投资建议。')}</footer>`;
      document.getElementById('copyLink').onclick=async event=>{try{await navigator.clipboard.writeText(location.href);event.currentTarget.textContent='已复制'}catch(_){event.currentTarget.textContent='请复制地址栏'}};
      const index=await loadIndex(snapshot);
      if(index?.dates?.length){document.getElementById('chartLabel').textContent=`${index.name||'上证指数'} · 静态行情`;document.getElementById('marketChart').innerHTML=previewChart(index);drawChart(index)}else{document.getElementById('marketChart').innerHTML='<div class="chart-status">暂无指数行情快照</div>';document.getElementById('chartLoading')?.remove()}
      loadSectors();
    }
    loadSnapshot().then(render).catch(error=>{app.innerHTML=`<section class="sheet error"><h1>无法打开这份快照</h1><p>${esc(error.message||error)}</p><a href="${homeUrl}">${isGithub?'查看最新快照':'返回股票组合观察台'}</a></section>`});
  </script>
</body>
</html>
