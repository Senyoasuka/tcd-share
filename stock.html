<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="A股个股走势与风险分析快照">
  <title>个股走势与仓位分析</title>
  <style>
    :root{--bg:#f3f5f7;--paper:#fff;--line:#dfe5ea;--ink:#17202a;--dim:#697586;--blue:#1769aa;--soft:#edf6fd;--red:#c62828;--green:#26734d;--amber:#9a6200}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    button,a{font:inherit}.wrap{width:min(980px,calc(100% - 30px));margin:0 auto;padding:18px 0 48px}.panel,.header,.footer{margin-bottom:14px;padding:20px 22px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
    .head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.12em}h1{margin:5px 0 3px;font-size:25px;line-height:1.3}.sub,.muted{color:var(--dim);font-size:12px}.actions{display:flex;gap:8px}.actions a,.actions button{display:grid;place-items:center;min-height:36px;padding:0 13px;border:1px solid #b8c7d5;border-radius:6px;background:#fff;color:var(--blue);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}.actions .primary{border-color:var(--blue);background:var(--blue);color:#fff}
    .summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;margin-top:18px;overflow:hidden;border:1px solid var(--line);border-radius:7px;background:var(--line)}.stat{padding:11px 12px;background:#fafcfd}.stat span{display:block;color:var(--dim);font-size:11px}.stat strong{font-size:19px;font-variant-numeric:tabular-nums}.up{color:var(--red)}.down{color:var(--green)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-head h2{margin:0;padding-left:11px;border-left:4px solid var(--blue);font-size:18px}.periods{display:flex;gap:5px}.periods button{padding:5px 11px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--dim);cursor:pointer}.periods button.active{border-color:var(--blue);background:var(--blue);color:#fff}.chart{height:390px;border:1px solid var(--line);border-radius:7px}.chart-status{display:grid;place-items:center;height:100%;color:var(--dim)}
    .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.price-card{padding:10px 12px;border-left:3px solid var(--blue);background:var(--soft)}.price-card span{display:block;color:var(--dim);font-size:11px}.price-card strong{font-size:18px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f6f8fa;color:#4b5868;font-size:12px;white-space:nowrap}td{font-size:13px}tr:last-child td{border-bottom:0}.lead{padding:11px 14px;border-left:3px solid var(--blue);background:var(--soft)}.empty{display:grid;place-items:center;min-height:92px;padding:14px;color:var(--dim);text-align:center}.source-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;color:var(--dim);font-size:11px}.source-note a,.event-link{color:var(--blue);text-decoration:none}.source-note a:hover,.event-link:hover{text-decoration:underline}.risk-list{margin:0;padding-left:21px}.risk-list li{margin:7px 0}.footer{margin-bottom:0;color:var(--dim);font-size:11px}.error{max-width:680px;margin:70px auto}.error a{color:var(--blue)}
    @media(max-width:680px){body{overflow-x:hidden}.wrap{width:calc(100% - 18px);padding:9px 0 30px}.panel,.header,.footer{padding:15px 12px}.head{display:block}h1{font-size:21px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:13px;width:100%}.actions a,.actions button{min-width:0;padding:0 7px;white-space:nowrap}.summary{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.chart{height:310px}.section-head{align-items:flex-start;flex-direction:column}.price-grid{grid-template-columns:1fr}.table-wrap{margin:0 -2px}th,td{padding:9px 8px;font-size:12px}}
  </style>
</head>
<body>
  <main class="wrap" id="app"><div class="empty">正在读取个股快照...</div></main>
  <script>
    const app=document.getElementById('app');
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const num=(value,d=2)=>value==null||Number.isNaN(Number(value))?'—':Number(value).toFixed(d);
    const pct=value=>value==null||Number.isNaN(Number(value))?'—':`${Number(value)>=0?'+':''}${Number(value).toFixed(2)}%`;
    const decode=value=>{const n=value.replace(/-/g,'+').replace(/_/g,'/');const binary=atob(n+'='.repeat((4-n.length%4)%4));return JSON.parse(new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0))))};
    const isGithub=location.hostname.endsWith('.github.io'),siteRoot=isGithub?`/${location.pathname.split('/').filter(Boolean)[0]}`:'';
    const backUrl=isGithub?`${siteRoot}/`:'/portfolio_analysis_workbench?tab=risk';
    function stockId(){return String(location.pathname.match(/\/s\/([a-zA-Z0-9_-]+)/)?.[1]||new URLSearchParams(location.search).get('id')||'').replace(/[^a-zA-Z0-9_-]/g,'')}
    function normalize(raw){
      if(raw.version||raw.kline)return raw;
      const item=raw.stock_signal||raw.stock||raw;
      const sector=raw.sector||raw.industry||{};
      return{version:0,snapshot_date:raw.snapshot_date||'',stock:{code:item.code||item.stock_code||'',name:item.name||item.stock_name||item.code||''},quote:{latest_price:item.latest_price,pct_change:item.latest_pct},performance:{},technical:[{indicator:'RSI14',value:item.rsi14,signal:Number(item.rsi14)>=70?'超买':'观察',comment:'来自分享时的申万行业强势股扫描。'},{indicator:'近期强势记录',value:`${(item.strong_days||[]).length} 次涨幅≥5%`,signal:(item.limit_up_dates||[]).length?`涨停 ${(item.limit_up_dates||[]).length} 次`:'动量观察',comment:`最高单日涨幅 ${num(item.max_gain_pct)}%`}],industry:sector,strong_signal:item,kline:{dates:[],ohlc:[],ma20:[],ma60:[],volumes:[]},fundamentals:[],performance_forecast:[],events:[],valuation:[],institution_forecasts:[],decision_levels:[],scenarios:[],risk_tips:['本页来自行业快照跳转，仅包含分享时已固化的行情信号。'],data_notes:{fundamentals:'该即时跳转页未固化财报与估值数据。'},disclaimer:'本页仅供信息记录与复盘，不构成投资建议。'}
    }
    async function load(){const encoded=new URLSearchParams(location.hash.replace(/^#/,'')).get('data');if(encoded){const raw=decode(encoded);if(!raw.version&&!raw.kline){const item=raw.stock_signal||raw.stock||raw,code=String(item.code||item.stock_code||'').replace(/\D/g,'').slice(-6);if(/^\d{6}$/.test(code)){location.replace(isGithub?`${siteRoot}/stock_market_v84.html?code=${encodeURIComponent(code)}`:`/m/${encodeURIComponent(code)}`);return new Promise(()=>{})}}return normalize(raw)}const id=stockId();if(!id)throw new Error('链接中没有个股快照');const response=await fetch(`${siteRoot}/static_risk/stocks/${id}.json`,{cache:'no-store'});if(!response.ok)throw new Error('这份个股快照不存在或尚未发布');return normalize(await response.json())}
    let chartPromise;function chartLib(){if(window.echarts)return Promise.resolve(window.echarts);if(chartPromise)return chartPromise;chartPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=`${siteRoot}/echarts.min.js?v=5.5.0`;s.onload=()=>resolve(window.echarts);s.onerror=()=>reject(new Error('图表库加载失败'));document.head.appendChild(s)});return chartPromise}
    function resample(kline,period){if(period==='day')return kline;const bucket=new Map();(kline.dates||[]).forEach((date,i)=>{const d=new Date(`${date}T00:00:00`);const key=period==='month'?date.slice(0,7):`${d.getFullYear()}-${String(Math.ceil((((d-new Date(d.getFullYear(),0,1))/86400000)+new Date(d.getFullYear(),0,1).getDay()+1)/7)).padStart(2,'0')}`;const row=kline.ohlc?.[i];if(!row)return;const old=bucket.get(key);bucket.set(key,old?{date,ohlc:[old.ohlc[0],row[1],Math.min(old.ohlc[2],row[2]),Math.max(old.ohlc[3],row[3])],volume:(old.volume||0)+(Number(kline.volumes?.[i])||0)}:{date,ohlc:[...row],volume:Number(kline.volumes?.[i])||0})});const rows=[...bucket.values()];return{dates:rows.map(x=>x.date),ohlc:rows.map(x=>x.ohlc),volumes:rows.map(x=>x.volume),ma20:[],ma60:[]}}
    async function draw(kline,period='day'){const host=document.getElementById('chart');if(!host)return;if(!kline?.dates?.length){host.innerHTML='<div class="chart-status">这份快照暂无个股 K 线</div>';return}host.innerHTML='<div class="chart-status">交互图表加载中...</div>';try{const ec=await chartLib(),data=resample(kline,period);host.innerHTML='';const c=ec.init(host);c.setOption({animation:false,tooltip:{trigger:'axis',axisPointer:{type:'cross'}},legend:{data:['K线','MA20','MA60'],right:8,top:4},grid:[{left:48,right:14,top:38,height:'61%'},{left:48,right:14,top:'79%',height:'9%'}],xAxis:[{type:'category',data:data.dates},{type:'category',gridIndex:1,data:data.dates,axisLabel:{show:false}}],yAxis:[{scale:true,splitLine:{lineStyle:{color:'#edf0f3',type:'dashed'}}},{gridIndex:1,axisLabel:{show:false},splitLine:{show:false}}],dataZoom:[{type:'inside',xAxisIndex:[0,1],start:45,end:100},{type:'slider',xAxisIndex:[0,1],start:45,end:100,height:14,bottom:0}],series:[{name:'K线',type:'candlestick',data:data.ohlc,itemStyle:{color:'#c62828',color0:'#26734d',borderColor:'#c62828',borderColor0:'#26734d'}},{name:'MA20',type:'line',data:data.ma20||[],showSymbol:false},{name:'MA60',type:'line',data:data.ma60||[],showSymbol:false},{name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:data.volumes||[],itemStyle:{color:'#94a3b8'}}]});addEventListener('resize',()=>c.resize(),{passive:true});window.stockChart=c}catch(e){host.innerHTML=`<div class="chart-status">${esc(e.message)}</div>`}}
    const empty=message=>`<div class="empty">${esc(message)}</div>`;
    const table=(headers,rows)=>rows?.length?`<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:empty('暂无可靠数据，本页不生成占位数字。');
    function render(p){
      const s=p.stock||{},q=p.quote||{},perf=p.performance||{},industry=p.industry||{};document.title=`${s.name||s.code}（${s.code}）走势与仓位分析`;
      const technical=(p.technical||[]).map(x=>`<tr><td>${esc(x.indicator)}</td><td>${esc(x.value??'—')}</td><td>${esc(x.signal||'—')}</td><td>${esc(x.comment||'')}</td></tr>`);
      const levels=(p.decision_levels||[]).map(x=>`<tr><td>${esc(x.direction)}</td><td>${num(x.price)}</td><td>${esc(x.level)}</td><td>${esc(x.comment)}</td></tr>`);
      const scenarios=(p.scenarios||[]).map(x=>`<tr><td>${esc(x.scenario)}</td><td>${esc(x.trigger)}</td><td>${esc(x.action)}</td><td>${esc(x.position_cap)}</td></tr>`);
      const events=(p.events||[]).map(x=>`<tr><td>${esc(x.date||'—')}</td><td>${x.url?`<a class="event-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title||'关联事件')}</a>`:esc(x.title||'关联事件')}</td><td>${esc(x.summary||'—')}</td></tr>`);
      const sourceLink=(key,label)=>p.sources?.[key]?`<a href="${esc(p.sources[key])}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`:'';
      const researchRows=(p.institution_forecasts||[]).map(x=>`<tr><td>${esc(x.institution||'—')}</td><td>${esc(x.report_date||'—')}</td><td>${esc(x.rating||'—')}</td><td>${esc(x.forecast||[x.year&&`${x.year}年`,x.eps&&`EPS ${x.eps}`,x.pe&&`PE ${x.pe}`].filter(Boolean).join(' · ')||'—')}</td><td>${x.url?`<a class="event-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title||'查看研报')}</a>`:esc(x.title||'—')}</td></tr>`);
      app.innerHTML=`<header class="header"><div class="head"><div><div class="eyebrow">STOCK SNAPSHOT · 只读</div><h1>${esc(s.name||s.code)}（${esc(s.code)}）走势与仓位分析</h1><div class="sub">快照日期 ${esc(p.snapshot_date||'—')} · ${esc(p.data_notes?.market||'静态数据')}</div></div><div class="actions"><button class="primary" id="copy">复制链接</button><a href="${backUrl}">返回组合快照</a></div></div><div class="summary"><div class="stat"><span>最新价</span><strong>${num(q.latest_price)}</strong></div><div class="stat"><span>当日涨跌</span><strong class="${Number(q.pct_change)>=0?'up':'down'}">${pct(q.pct_change)}</strong></div><div class="stat"><span>5日涨跌</span><strong>${pct(perf.return_5d)}</strong></div><div class="stat"><span>20日涨跌</span><strong>${pct(perf.return_20d)}</strong></div><div class="stat"><span>申万二级行业</span><strong>${esc(industry.industry_name||'暂未映射')}</strong></div></div></header>
      <section class="panel"><div class="section-head"><h2>一、近期走势</h2><div class="periods"><button class="active" data-period="day">日K</button><button data-period="week">周K</button><button data-period="month">月K</button></div></div><div id="chart" class="chart"><div class="chart-status">正在准备图表...</div></div><div class="price-grid"><div class="price-card"><span>60日高点</span><strong>${num(perf.high_60d)}</strong></div><div class="price-card"><span>60日低点</span><strong>${num(perf.low_60d)}</strong></div><div class="price-card"><span>当日换手率</span><strong>${q.turnover==null?'—':`${num(q.turnover)}%`}</strong></div></div></section>
      <section class="panel"><div class="section-head"><h2>二、技术面信号</h2></div>${table(['指标','数值','信号','解读'],technical)}</section>
      <section class="panel"><div class="section-head"><h2>三、申万二级行业</h2></div><div class="lead"><strong>${esc(industry.industry_name||'暂未映射')}</strong> · 行业代码 ${esc(industry.industry_code||'—')} · 连续站上 MA5 ${industry.above_ma5_days==null?'—':`${industry.above_ma5_days} 天`} · RSI14 ${num(industry.rsi14)}</div></section>
      <section class="panel"><div class="section-head"><h2>四、基本面与业绩</h2></div>${table(['报告期','披露日','营收','归母净利','扣非净利','经营现金流','毛利率','ROE'],(p.fundamentals||[]).map(x=>`<tr>${['period','notice_date','revenue','net_profit','deducted_profit','cash_flow','gross_margin','roe'].map(k=>`<td>${esc(x[k]??'—')}</td>`).join('')}</tr>`))}<div class="source-note"><span>${esc(p.data_notes?.fundamentals||'仅展示已披露财务数据')}</span>${sourceLink('finance','核对财务原始页')}</div><h3>业绩预告</h3>${table(['报告期','披露日','类型','归母净利变动','预告净利','原因'],(p.performance_forecast||[]).map(x=>`<tr><td>${esc(x.period)}</td><td>${esc(x.notice_date||'—')}</td><td>${esc(x.type)}</td><td>${esc(x.change)}</td><td>${esc(x.amount||'—')}</td><td>${esc(x.comment)}</td></tr>`))}<div class="source-note"><span>业绩预告按公告披露时点固化</span>${sourceLink('forecast','核对业绩预告')}</div><h3>关键事件</h3>${table(['日期','事件','说明'],events)}</section>
      <section class="panel"><div class="section-head"><h2>五、估值定位</h2></div>${table(['口径','数值','解读'],(p.valuation||[]).map(x=>`<tr><td>${esc(x.metric)}</td><td>${esc(x.value)}</td><td>${esc(x.comment)}</td></tr>`))}<div class="source-note"><span>${esc(p.data_notes?.valuation||'估值按快照时点固化')}</span>${sourceLink('quote','核对行情页')}</div><h3>机构盈利预测</h3>${table(['机构','报告日','评级','EPS / PE 预测','研报主题'],researchRows)}<div class="source-note"><span>机构预测为各研究机构独立观点，不代表本页面判断</span>${sourceLink('research','核对研报列表')}</div></section>
      <section class="panel"><div class="section-head"><h2>六、仓位决策框架</h2></div><h3>分批观察档位</h3>${table(['方向','价位','档位','说明'],levels)}<h3>情景推演</h3>${table(['情景','触发条件','动作','仓位上限'],scenarios)}</section>
      <section class="panel"><div class="section-head"><h2>七、风险提示</h2></div><ul class="risk-list">${(p.risk_tips||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>暂无额外风险提示。</li>'}</ul></section><footer class="footer">${esc(p.disclaimer||'')}</footer>`;
      document.getElementById('copy').onclick=async e=>{try{await navigator.clipboard.writeText(location.href);e.currentTarget.textContent='已复制'}catch(_){e.currentTarget.textContent='请复制地址栏'}};
      document.querySelectorAll('[data-period]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===btn));window.stockChart?.dispose();draw(p.kline,btn.dataset.period)});draw(p.kline);
    }
    load().then(render).catch(error=>{app.innerHTML=`<section class="panel error"><h1>无法打开个股快照</h1><p>${esc(error.message||error)}</p><a href="${backUrl}">返回组合快照</a></section>`});
  </script>
</body>
</html>
