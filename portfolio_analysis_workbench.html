<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>股票组合观察台</title>
  <style>
    :root {
      --bg: #edf2f7;
      --bg-2: #f6f9fc;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --line: rgba(27, 50, 86, 0.08);
      --line-strong: rgba(27, 50, 86, 0.14);
      --text: #152033;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-soft: rgba(37, 99, 235, 0.1);
      --shadow: 0 30px 80px rgba(23, 34, 58, 0.12);
      --up: #d92d20;
      --up-soft: rgba(217, 45, 32, 0.12);
      --down: #039855;
      --down-soft: rgba(3, 152, 85, 0.12);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.12);
      --violet: #7c3aed;
      --violet-soft: rgba(124, 58, 237, 0.12);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    /* Scrollbar Polish */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(27, 50, 86, 0.12);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(27, 50, 86, 0.22);
    }
    
    /* 閽堝缁勫悎搴撶殑妯悜婊氬姩鏉″仛涓撻棬鐨勪紭鍖?*/
    .portfolio-library::-webkit-scrollbar {
      height: 8px;
    }
    .portfolio-library::-webkit-scrollbar-track {
      background: rgba(27, 50, 86, 0.03);
      border-radius: 999px;
    }
    .portfolio-library::-webkit-scrollbar-thumb {
      background: rgba(37, 99, 235, 0.25);
      border-radius: 999px;
    }
    .portfolio-library::-webkit-scrollbar-thumb:hover {
      background: rgba(37, 99, 235, 0.4);
    }

    /* Smooth Tab Animation */
    .tab-view {
      animation: tabFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes tabFadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(37, 99, 235, 0.12), transparent 26%),
        radial-gradient(circle at 100% 0%, rgba(124, 58, 237, 0.08), transparent 22%),
        linear-gradient(180deg, #eef4fa 0%, #f8fbff 46%, #edf2f7 100%);
      font-family: "SF Pro Display", "SF Pro SC", "PingFang SC", "Helvetica Neue",
        "Microsoft YaHei", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.22) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.24), transparent 72%);
      opacity: 0.36;
    }

    .app-shell {
      width: 100%;
      max-width: 1440px; /* 鎺у埗鏁翠綋鏈€澶у搴﹀湪鑸掗€傜殑闃呰鑼冨洿鍐?*/
      margin: 0 auto;
      padding: 30px 24px 60px;
      position: relative;
      z-index: 1;
    }

    .glass {
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow);
    }

    .hero {
      display: block;
    }

    .hero-main,
    .toolbar,
    .workspace-card,
    .panel-card,
    .tab-card {
      border-radius: var(--radius-xl);
    }

    .hero-main {
      padding: 26px 30px;
      min-height: 168px;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(320px, 0.98fr);
      gap: 18px;
      align-items: start;
      background:
        radial-gradient(circle at 10% 22%, rgba(37, 99, 235, 0.16), transparent 36%),
        radial-gradient(circle at 86% 18%, rgba(124, 58, 237, 0.1), transparent 28%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(243, 248, 255, 0.82));
    }

    .hero-main::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.16), transparent 70%);
      right: -140px;
      top: -160px;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(37, 99, 235, 0.16);
      color: #1e3a8a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 16px 0 0;
      font-size: 48px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #0284c7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 900px;
      filter: drop-shadow(0 4px 12px rgba(37, 99, 235, 0.15));
    }

    .hero-top {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .hero-side {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-content: start;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .hero-stat {
      border-radius: 24px;
      padding: 18px 18px 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(244, 248, 255, 0.72));
      border: 1px solid rgba(37, 99, 235, 0.08);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.05);
    }

    .hero-stat .label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .hero-stat .value {
      font-size: 32px;
      line-height: 1.06;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }

    .hero-stat .note {
      font-size: 13px;
      line-height: 1.65;
      color: #44506a;
    }

    .command-bar {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .command-left,
    .command-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .feed-drawer-panel {
      flex: 1 0 100%;
      width: 100%;
      padding-top: 12px;
      border-top: 1px solid rgba(27, 50, 86, 0.06);
    }

    .feed-drawer-panel[hidden] {
      display: none;
    }

    .command-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .hidden-file-input {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.03em;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .dropzone {
      position: relative;
      border-radius: 20px;
      border: 1.5px dashed rgba(37, 99, 235, 0.18);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.04), rgba(255, 255, 255, 0.76));
      padding: 20px 18px;
      overflow: hidden;
    }

    .dropzone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .dropzone strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .dropzone p {
      margin: 0;
      color: var(--muted);
      line-height: 1.72;
      font-size: 14px;
      max-width: 760px;
    }

    .import-drawer {
      min-width: 320px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(27, 50, 86, 0.08);
      overflow: hidden;
    }

    .import-drawer.is-open {
      box-shadow: 0 16px 34px rgba(24, 39, 75, 0.08);
    }

    .import-drawer-toggle {
      width: 100%;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      background: transparent;
      color: #152033;
    }

    .import-drawer-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .import-drawer-title strong {
      font-size: 15px;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .import-drawer .fold-toggle-text {
      color: #1e3a8a;
      font-size: 12px;
      font-weight: 700;
    }

    .import-drawer-body {
      padding: 14px;
      border-top: 1px solid rgba(27, 50, 86, 0.06);
    }

    .uploader-meta {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .feed-form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .feed-field {
      display: grid;
      gap: 6px;
    }

    .feed-field label {
      font-size: 12px;
      font-weight: 800;
      color: #334155;
    }

    .feed-field input,
    .feed-field select,
    .feed-field textarea {
      width: 100%;
      border: 1px solid rgba(27, 50, 86, 0.1);
      border-radius: 12px;
      padding: 11px 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.92);
      font: inherit;
      line-height: 1.55;
      outline: none;
    }

    .feed-field textarea {
      min-height: 180px;
      resize: vertical;
    }

    .feed-field input:focus,
    .feed-field select:focus,
    .feed-field textarea:focus {
      border-color: rgba(37, 99, 235, 0.42);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .feed-field.full {
      grid-column: 1 / -1;
    }

    .feed-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .natural-import-hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .feed-inline-status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(15, 118, 110, 0.08);
      border: 1px solid rgba(15, 118, 110, 0.14);
      color: #0f766e;
      font-size: 13px;
      line-height: 1.55;
      min-height: 40px;
    }

    .feed-inline-status.warn {
      background: rgba(217, 119, 6, 0.1);
      border-color: rgba(217, 119, 6, 0.18);
      color: #92400e;
    }

    .feed-inline-status.error {
      background: rgba(217, 45, 32, 0.1);
      border-color: rgba(217, 45, 32, 0.18);
      color: #991b1b;
    }

    .tag {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid rgba(27, 50, 86, 0.08);
      background: rgba(255, 255, 255, 0.82);
      color: #334155;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .action-btn,
    .pill-btn {
      border-radius: 18px;
      padding: 14px 16px;
      font-weight: 700;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .action-btn:hover,
    .pill-btn:hover {
      transform: translateY(-1px);
    }

    .action-btn:disabled,
    .pill-btn:disabled {
      cursor: wait;
      opacity: 0.62;
      transform: none;
    }

    .action-btn.primary,
    .pill-btn.primary {
      background: linear-gradient(135deg, #1d4ed8, #2563eb 52%, #3b82f6);
      color: #fff;
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.22);
    }

    .action-btn.secondary,
    .pill-btn.secondary {
      background: rgba(255, 255, 255, 0.85);
      color: #1f2b43;
      border: 1px solid rgba(27, 50, 86, 0.08);
    }

    .pill-btn.is-active {
      color: #fff;
      background: linear-gradient(135deg, #1d4ed8, #2563eb 52%, #3b82f6);
      border-color: rgba(37, 99, 235, 0.26);
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.2);
    }

    .action-note {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.65;
      color: var(--muted);
    }

    .workspace {
      margin-top: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
    }

    .tab-card {
      padding: 14px;
      position: static;
      align-self: stretch;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .brand-lockup {
      border-radius: 22px;
      padding: 16px 18px;
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.08), rgba(255, 255, 255, 0.72));
      border: 1px solid rgba(37, 99, 235, 0.08);
      margin-bottom: 12px;
    }

    .brand-lockup strong {
      display: block;
      font-size: 20px;
      letter-spacing: -0.04em;
    }

    .brand-lockup span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 13px;
    }

    .brand-lockup,
    .portfolio-rail {
      display: none;
    }

    .portfolio-rail {
      margin-bottom: 12px;
      padding: 14px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(27, 50, 86, 0.08);
      width: 100%;
      overflow: hidden; /* 闃叉鍐呴儴瀛愬厓绱犳孩鍑?*/
    }

    .portfolio-rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .portfolio-rail-head strong {
      font-size: 15px;
      letter-spacing: -0.03em;
    }

    .portfolio-rail-head span {
      font-size: 12px;
      color: var(--muted);
    }

    .portfolio-library {
      display: grid;
      grid-auto-flow: column;
      /* 閫氳繃 calc 绮剧‘璁＄畻瀹藉害锛氭瘡灞忔樉绀?涓紝鍑忓幓3涓猤ap(12px)鐨勬€诲拰鍒嗛厤 */
      grid-auto-columns: calc((100% - 36px) / 4);
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
      scroll-padding-left: 0;
    }
    
    /* 璁╂瘡涓€椤逛篃鑳借鍚搁檮 */
    .portfolio-item {
      scroll-snap-align: start;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(27, 50, 86, 0.08);
      padding: 14px;
      min-height: 148px;
    }

    .portfolio-item.active {
      border-color: rgba(37, 99, 235, 0.2);
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.08);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.08), rgba(255, 255, 255, 0.92));
    }

    .portfolio-select {
      width: 100%;
      text-align: left;
      background: transparent;
      padding: 0;
      border: 0;
    }

    .portfolio-select strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .portfolio-select span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .portfolio-row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
    }

    .portfolio-mini {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-chip {
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(27, 50, 86, 0.08);
      font-size: 11px;
      color: #334155;
    }

    .compare-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }

    .compare-check input {
      accent-color: var(--blue);
    }

    .current-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #1e3a8a;
      user-select: none;
      font-weight: 700;
    }

    .current-check input {
      accent-color: var(--blue);
    }

    .tab-nav {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding-bottom: 2px;
    }

    .tab-btn {
      flex: 1 0 150px;
      min-height: 52px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid transparent;
      padding: 12px 14px;
      color: #223049;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-1px);
    }

    .tab-btn .tab-name {
      display: block;
      font-size: 15px;
      font-weight: 700;
    }

    .tab-btn .tab-desc {
      display: none;
    }

    .tab-btn.active {
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.12), rgba(255, 255, 255, 0.88));
      border-color: rgba(37, 99, 235, 0.14);
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.06);
    }

    .workspace-card {
      padding: 14px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .status-left strong {
      display: block;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .status-left span {
      color: var(--muted);
      font-size: 13px;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-chip {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(27, 50, 86, 0.08);
      color: #334155;
    }

    .status-chip.red {
      color: var(--up);
      background: var(--up-soft);
      border-color: rgba(217, 45, 32, 0.12);
    }

    .status-chip.green {
      color: var(--down);
      background: var(--down-soft);
      border-color: rgba(3, 152, 85, 0.12);
    }

    .status-chip.violet {
      color: var(--violet);
      background: var(--violet-soft);
      border-color: rgba(124, 58, 237, 0.12);
    }

    .view {
      display: none;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      animation: fadeIn 220ms ease;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .metric-card {
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(27, 50, 86, 0.07);
      padding: 16px 16px 14px;
      min-width: 0;
    }

    .metric-card.focus {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(37, 99, 235, 0.08));
      border-color: rgba(37, 99, 235, 0.16);
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.1);
    }

    .metric-card .metric-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .metric-card .metric-value {
      font-size: 34px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }

    .metric-card .metric-note {

      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .tile {
      padding: 16px;
    }

    .tile strong {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .tile span {
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
    }

    .table-wrap {
      margin-top: 14px;
      border-radius: 22px;
      overflow-x: auto;
      overflow-y: visible;
      border: 1px solid rgba(27, 50, 86, 0.08);
      background: rgba(255, 255, 255, 0.82);
      max-height: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    th,
    td {
      padding: 12px 12px;
      border-bottom: 1px solid rgba(27, 50, 86, 0.06);
      text-align: center;
      font-size: 13px;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: rgba(246, 250, 255, 0.96);
      color: #4b5d7a;
      font-weight: 800;
      z-index: 2;
    }

    td.left,
    th.left {
      text-align: left;
    }

    .up-text {
      color: var(--up);
      font-weight: 700;
    }

    .down-text {
      color: var(--down);
      font-weight: 700;
    }

    .template-box {
      margin-top: 14px;
      padding: 16px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.07), rgba(255, 255, 255, 0.82));
      border: 1px solid rgba(124, 58, 237, 0.08);
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .kv-card {
      border-radius: 18px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(27, 50, 86, 0.08);
    }

    .kv-card strong {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      letter-spacing: -0.02em;
    }

    .kv-card h4 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .kv-card ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 8px;
      color: #24324a;
      font-size: 13px;
      line-height: 1.65;
    }

    .stack-grid {
      display: grid;
      gap: 14px;
    }

    .pill-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .ghost-pill {
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(27, 50, 86, 0.08);
      font-size: 12px;
      color: #334155;
    }

    .template-box code {
      display: block;
      margin-top: 12px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(27, 50, 86, 0.08);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #1f2937;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .compare-card {
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(27, 50, 86, 0.08);
    }

    .compare-card.highlight {
      box-shadow: 0 18px 34px rgba(24, 39, 75, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.9));
    }

    .compare-card.highlight.win {
      border-color: rgba(217, 45, 32, 0.18);
      background: linear-gradient(180deg, rgba(217, 45, 32, 0.08), rgba(255, 255, 255, 0.96));
    }

    .compare-card.highlight.gain {
      border-color: rgba(37, 99, 235, 0.18);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.08), rgba(255, 255, 255, 0.96));
    }

    .compare-card.highlight.hold {
      border-color: rgba(217, 119, 6, 0.18);
      background: linear-gradient(180deg, rgba(217, 119, 6, 0.08), rgba(255, 255, 255, 0.96));
    }

    .compare-card strong {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .compare-card span {
      display: block;
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .compare-card em {
      display: block;
      margin-top: 10px;
      color: #334155;
      font-size: 13px;
      font-style: normal;
      line-height: 1.5;
    }

    .compare-conclusion-card,
    .compare-strip-shell {
      margin-bottom: 16px;
    }

    .compare-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(220px, 260px);
      gap: 12px;
      overflow-x: auto;
      overflow-y: visible;
      padding-bottom: 6px;
    }

    .compare-strip-card {
      padding: 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(27, 50, 86, 0.08);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
      min-height: 156px;
    }

    .compare-strip-card.active {
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.1), rgba(255, 255, 255, 0.92));
      border-color: rgba(37, 99, 235, 0.16);
    }

    .compare-strip-card strong,
    .compare-strip-card span {
      display: block;
    }

    .compare-strip-card strong {
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .compare-strip-card span {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .compare-strip-metrics {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .compare-strip-metrics label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: #475569;
    }

    .compare-strip-metrics b {
      font-size: 13px;
      color: #0f172a;
    }

    .champion-cell {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 244, 214, 0.88));
      border-left: 1px solid rgba(217, 119, 6, 0.18);
      border-right: 1px solid rgba(217, 119, 6, 0.18);
      box-shadow: inset 0 0 0 1px rgba(217, 119, 6, 0.08);
    }

    .champion-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 22px;
      margin-bottom: 8px;
      padding: 0 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f59e0b, #d97706);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      box-shadow: 0 8px 18px rgba(217, 119, 6, 0.22);
    }

    .champion-value {
      display: block;
      font-weight: 800;
      color: #1f2937;
    }

    .champion-note {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #92400e;
      line-height: 1.45;
    }

    .empty-state {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px dashed rgba(27, 50, 86, 0.14);
      color: var(--muted);
      line-height: 1.7;
      text-align: center;
    }

    .footnote {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .fold-panel {
      margin-top: 12px;
      border-top: 1px dashed rgba(27, 50, 86, 0.1);
      padding-top: 12px;
    }

    .fold-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      background: transparent;
      color: #1e3a8a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .fold-toggle::before {
      content: "+";
      width: 18px;
      height: 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.12);
      color: #1d4ed8;
      font-size: 13px;
      line-height: 1;
    }

    .fold-panel.is-open .fold-toggle::before,
    .import-drawer.is-open .fold-toggle::before {
      content: "-";
    }

    .fold-content {
      margin-top: 10px;
    }

    .fold-copy {
      margin-top: 10px;
      color: #24324a;
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .compare-visual-card {
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(27, 50, 86, 0.08);
    }

    .compare-visual-card h3 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: -0.03em;
    }

    .compare-visual-card p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .radar-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 16px;
      align-items: center;
    }

    .radar-stage {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 40%, rgba(37, 99, 235, 0.08), rgba(255, 255, 255, 0.02) 70%);
      border-radius: 22px;
    }

    .radar-stage svg {
      width: 100%;
      height: 100%;
      max-width: 420px;
    }

    .radar-legend {
      display: grid;
      gap: 10px;
    }

    .radar-legend-item {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(27, 50, 86, 0.06);
    }

    .radar-legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
    }

    .radar-legend-item strong,
    .radar-legend-item span {
      display: block;
    }

    .radar-legend-item strong {
      font-size: 13px;
    }

    .radar-legend-item span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .heatmap-grid {
      display: grid;
      gap: 10px;
    }

    .heatmap-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
    }

    .heatmap-label {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(248, 250, 252, 0.88);
      border: 1px solid rgba(27, 50, 86, 0.08);
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    .heatmap-scroll {
      overflow-x: auto;
      overflow-y: visible;
      padding-bottom: 4px;
    }

    .heatmap-cells {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(138px, 154px);
      gap: 10px;
      min-width: max-content;
    }

    .heatmap-cell {
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(27, 50, 86, 0.06);
      min-height: 72px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.36);
    }

    .heatmap-cell.active {
      box-shadow:
        inset 0 0 0 1px rgba(37, 99, 235, 0.22),
        0 10px 20px rgba(37, 99, 235, 0.08);
    }

    .heatmap-cell strong,
    .heatmap-cell span {
      display: block;
    }

    .heatmap-cell strong {
      font-size: 12px;
      color: #334155;
      line-height: 1.45;
    }

    .heatmap-cell span {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #0f172a;
    }

    .risk-shell {
      display: grid;
      gap: 16px;
    }

    .portable-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin: 14px 0;
      padding: 12px 16px;
      border: 1px solid rgba(27, 50, 86, 0.1);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
    }

    .portable-toolbar-copy {
      display: grid;
      gap: 3px;
      min-width: 240px;
    }

    .portable-toolbar-copy strong {
      color: #0f172a;
      font-size: 14px;
    }

    .portable-toolbar-copy span {
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .portable-toolbar-copy span.online {
      color: #15803d;
    }

    .portable-toolbar-copy span.offline {
      color: #b45309;
    }

    .portable-toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .risk-hero-grid {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .risk-gauge {
      width: 100%;
      height: 320px;
    }

    .risk-summary-card {
      display: grid;
      align-content: center;
      gap: 14px;
      padding: 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.82));
      border: 1px solid rgba(27, 50, 86, 0.08);
    }

    .risk-score-large {
      font-size: 52px;
      line-height: 1;
      font-weight: 900;
      color: #111827;
      letter-spacing: 0;
    }

    .risk-advice {
      color: #334155;
      font-size: 18px;
      line-height: 1.55;
      font-weight: 700;
    }

    .persona-core-panel {
      overflow: hidden;
      background:
        radial-gradient(circle at 8% 0%, rgba(37, 99, 235, 0.11), transparent 30%),
        linear-gradient(145deg, rgba(255,255,255,.98), rgba(247,250,255,.94));
    }

    .persona-core-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .persona-core-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid rgba(27, 50, 86, .09);
      border-radius: 20px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 12px 30px rgba(15, 23, 42, .055);
    }

    .persona-core-head {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #334155;
      font-size: 14px;
    }

    .persona-core-head span {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      font-size: 11px;
      font-weight: 900;
    }

    .persona-core-value {
      margin-top: 18px;
      color: #0f172a;
      font-size: clamp(28px, 2.5vw, 42px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -.05em;
    }

    .persona-core-value small {
      font-size: 15px;
      letter-spacing: 0;
      color: #64748b;
    }

    .persona-core-card > p {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }

    .persona-sector-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .persona-sector-list span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(37, 99, 235, .07);
      color: #1e3a8a;
      font-size: 12px;
    }

    .persona-sector-list b { font-weight: 800; }
    .persona-sector-list em { color: #64748b; font-style: normal; }

    .persona-core-note {
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px dashed rgba(100, 116, 139, .25);
      color: #64748b;
      font-size: 12px;
      line-height: 1.65;
    }

    .persona-frequency-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .persona-frequency-stats span {
      padding: 10px 7px;
      border-radius: 12px;
      background: #f8fafc;
      text-align: center;
    }

    .persona-frequency-stats b,
    .persona-frequency-stats em { display: block; }
    .persona-frequency-stats b { color: #0f172a; font-size: 17px; }
    .persona-frequency-stats em { margin-top: 4px; color: #64748b; font-size: 10px; font-style: normal; }

    .persona-match-panel {
      background: linear-gradient(145deg, rgba(245, 248, 255, .98), rgba(255, 255, 255, .96));
    }

    .persona-mode-badge {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      font-size: 12px;
      font-weight: 850;
      box-shadow: 0 10px 24px rgba(37, 99, 235, .2);
    }

    .persona-match-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .persona-match-block {
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(27, 50, 86, .08);
      background: rgba(255, 255, 255, .82);
    }

    .persona-match-block > strong,
    .persona-service-rights > strong {
      display: block;
      margin-bottom: 10px;
      color: #0f172a;
      font-size: 13px;
    }

    .persona-tag-cloud,
    .persona-service-rights > div {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .persona-tag-cloud span,
    .persona-service-rights span {
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
    }

    .persona-match-block.fit .persona-tag-cloud span {
      color: #1d4ed8;
      background: rgba(37, 99, 235, .09);
    }

    .persona-match-block.avoid .persona-tag-cloud span {
      color: #a16207;
      background: rgba(217, 119, 6, .1);
    }

    .persona-service-rights {
      margin-top: 12px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(5, 150, 105, .1);
      background: rgba(236, 253, 245, .64);
    }

    .persona-service-rights span {
      color: #047857;
      background: rgba(5, 150, 105, .1);
    }

    .persona-mode-note {
      margin-top: 12px;
      padding: 13px 15px;
      border-radius: 14px;
      color: #475569;
      background: rgba(255, 255, 255, .75);
      font-size: 12px;
      line-height: 1.7;
    }

    .persona-script-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .persona-client-script {
      min-width: 0;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(27, 50, 86, .08);
      background: linear-gradient(145deg, rgba(255,255,255,.98), rgba(248,250,252,.9));
    }

    .persona-client-script h4 { margin: 0; color: #0f172a; font-size: 16px; }
    .persona-client-script .section-title-row p { margin: 6px 0 0; color: #64748b; font-size: 11px; }

    .persona-script-copy {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed rgba(100, 116, 139, .24);
      color: #24324a;
      font-size: 13px;
      line-height: 1.78;
      white-space: pre-wrap;
    }

    .persona-ai-status {
      margin-top: 14px;
      padding: 10px 13px;
      border-radius: 13px;
      background: rgba(124, 58, 237, .08);
      color: #6d28d9;
      font-size: 12px;
      line-height: 1.6;
    }

    .persona-ai-status.success { background: rgba(22, 163, 74, .08); color: #15803d; }
    .persona-auto-ai-badge { display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border-radius: 999px; background: rgba(22,163,74,.09); color: #15803d; font-size: 11px; font-weight: 800; }
    .persona-auto-ai-badge i, .persona-chat-online i { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.13); }

    .persona-ai-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .persona-ai-card {
      min-width: 0;
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(124, 58, 237, .14);
      background: linear-gradient(145deg, rgba(255,255,255,.98), rgba(245,243,255,.72));
      box-shadow: 0 12px 30px rgba(79, 70, 229, .06);
    }

    .risk-kline-chart {

    .risk-event-stat.bearish strong {
      color: #1f8f4d;
    }

    .risk-event-caption {
      margin: 0;

    .risk-breadth-panel {

      gap: 9px;
      margin-top: 11px;
    }

      border-radius: 12px;

      border: 1px solid rgba(27, 50, 86, 0.07);

      color: #64748b;
      font-size: 11px;

      font-style: normal;

      color: #1f8f4d;
    }

    .risk-breadth-stat.bullish strong {
      color: #cf1322;
    }

    .risk-breadth-stat em {

    .risk-rule-direction,

      font-weight: 800;

    .risk-rule-direction.bullish {

    .risk-rule-direction.bearish {
      color: #126f3a;
      background: rgba(31, 143, 77, 0.10);

      color: #25324a;
      font-size: 12px;

    .risk-rule-copy span {
      margin-top: 3px;
      color: #94a3b8;

    .risk-rule-score {
      text-align: right;
      font-size: 14px;
      font-weight: 850;

    .risk-rule-score.bullish {
      color: #cf1322;
    }

    .risk-rule-score.bearish {
      color: #1f8f4d;
    }

    .risk-rule-status.triggered {
      color: #7c2d12;
      background: #ffedd5;
    }

    .risk-rule-status.not-triggered {
      color: #475569;
      background: #f1f5f9;

    .risk-rule-status.unavailable {
      color: #92400e;
      background: #fef3c7;
    }

    .risk-log-score {
      text-align: right;
      font-size: 17px;
      font-weight: 850;

    .risk-log-score.bearish {
      color: #1f8f4d;

      gap: 14px;

      font-weight: 700;
      white-space: nowrap;

      border: 1px solid rgba(37, 99, 235, .14);

      color: #344054;

      color: #475467;
      background: #f8faff;
      font-size: 12px;
      line-height: 1.6;

      display: flex;

    .stock-analysis-shortcuts button { min-height:34px; padding:0 10px; border:1px solid #c5d1dc; border-radius:7px; color:#315a87; background:#fff; font-size:11px; font-weight:800; cursor:pointer; }
    .stock-analysis-shortcuts button:hover { border-color:#315a87; background:#eef5fb; }
    .stock-analysis-open { display:grid; place-items:center; min-height:38px; padding:0 13px; border:1px solid #315a87; border-radius:8px; color:#fff; background:#315a87; font-size:12px; font-weight:850; text-decoration:none; white-space:nowrap; }
    .stock-analysis-frame-wrap { overflow:hidden; border:1px solid rgba(148,163,184,.3); border-radius:16px; background:#eef2f5; }
    .stock-analysis-frame { display:block; width:100%; height:78vh; min-height:760px; border:0; background:#eef2f5; }

    @media (max-width: 760px) {
      .share-snapshot-modal { padding:10px; align-items:end; }
      .share-snapshot-card { width:100%; padding:18px 14px 20px; border-radius:18px 18px 10px 10px; }
      .share-snapshot-head h2 { font-size:19px; }
      .share-snapshot-actions { grid-template-columns:1fr; }
      .stock-analysis-module-head { display:block; padding:15px 13px; }
      .stock-analysis-module-head h2 { font-size:19px; }
      .stock-analysis-open { margin-top:12px; width:100%; }
      .stock-analysis-frame { height:82vh; min-height:660px; }
    }

  </style>
</head>
<body>
  <div class="app-shell">
    <section class="hero">
      <div class="hero-main glass">
        <div class="hero-top">
          <div class="eyebrow">组合观察台</div>
          <h1>股票组合观察台</h1>
        </div>
        <div class="hero-side" id="heroStats"></div>
      </div>
    </section>
    <input class="hidden-file-input" id="fileInput" type="file" accept=".json,.html,.htm,.csv,.txt,.xls,.xlsx" multiple>
    <input class="hidden-file-input" id="folderInput" type="file" accept=".json,.html,.htm,.csv,.txt,.xls,.xlsx" multiple webkitdirectory directory>

    <section class="portable-toolbar" aria-label="数据导入与服务状态">
      <div class="portable-toolbar-copy">
        <strong>快捷操作</strong>
        <span id="connectionStatus">正在连接本地数据服务...</span>
      </div>
      <div class="portable-toolbar-actions">
        <button class="pill-btn primary" id="stockShareBtn" type="button">个股搜索 · 看盘 · 分享</button>
        <button class="pill-btn secondary" id="shareCurrentBtn" type="button">分享当前持仓</button>
        <button class="pill-btn secondary" id="publishWebSnapshotBtn" type="button">同步到云端</button>
        <button class="pill-btn secondary" id="triggerImportBtn" type="button">导入文件</button>
        <button class="pill-btn secondary" id="triggerFolderImportBtn" type="button">导入文件夹</button>
        <button class="pill-btn secondary" id="downloadCsvTemplateBtn" type="button">下载模板</button>
        <button class="pill-btn secondary" id="exportDatasetBtn" type="button">导出数据集</button>
      </div>
    </section>

    <section class="workspace">
      <aside class="tab-card glass">
        <div class="brand-lockup">
          <strong>券商管理分析台</strong>
          <span>当前组合会作为后续所有分析、画像、客群和话术的主分析对象。</span>
        </div>
        <div class="portfolio-rail">
          <div class="portfolio-rail-head">
            <strong>组合库</strong>
            <span id="portfolioCount">1 个</span>
          </div>
          <div class="portfolio-library" id="portfolioLibrary"></div>
          <button class="pill-btn secondary" id="compareSelectedBtn" style="margin-top:12px;">对比选中组合</button>
        </div>
        <nav class="tab-nav" id="tabNav"></nav>
      </aside>

      <main class="workspace-card glass">
        <div hidden>
          <strong id="statusTitle"></strong>
          <span id="statusDesc"></span>
          <span id="actionStatus"></span>
          <div id="statusChips"></div>
          <strong id="workspaceSummaryTitle"></strong>
          <p id="workspaceSummaryDesc"></p>
        </div>

        <section class="view active" id="view-overview"></section>
        <section class="view" id="view-compare"></section>
        <section class="view" id="view-risk"></section>
        <section class="view" id="view-stock"></section>
        <section class="view" id="view-validation"></section>
        <section class="view" id="view-style"></section>
        <section class="view" id="view-talk"></section>
        <section class="view" id="view-material"></section>
        <section class="view" id="view-persona"></section>
        <section class="view feed-surface" id="view-feed"></section>
        <section class="view" id="view-data"></section>
      </main>
    </section>
  </div>

  <div class="share-snapshot-modal" id="shareSnapshotModal" role="dialog" aria-modal="true" aria-labelledby="shareSnapshotTitle" hidden>
    <section class="share-snapshot-card">
      <div class="share-snapshot-head">
        <div><span>只读快照</span><h2 id="shareSnapshotTitle">分享当前持仓与风控</h2></div>
        <button class="share-snapshot-close" id="shareSnapshotCloseBtn" type="button" aria-label="关闭分享面板">×</button>
      </div>
      <p>链接固化当前持仓、总仓位、大盘风控分和主理人解释。以后修改持仓不会改变这个已分享快照。</p>
      <textarea class="share-snapshot-link" id="shareSnapshotLink" readonly aria-label="分享链接"></textarea>
      <div class="share-snapshot-actions"><button id="copyShareSnapshotBtn" type="button">复制链接</button><a id="openShareSnapshotLink" href="#" target="_blank" rel="noopener noreferrer">打开预览</a></div>
      <span class="share-snapshot-status" id="shareSnapshotStatus" aria-live="polite"></span>
    </section>
  </div>

  <div class="share-snapshot-modal" id="stockShareModal" role="dialog" aria-modal="true" aria-labelledby="stockShareTitle" hidden>
    <section class="share-snapshot-card">
      <div class="share-snapshot-head">
        <div><span>个股看盘</span><h2 id="stockShareTitle">搜索股票、看盘和即时分享</h2></div>
        <button class="share-snapshot-close" id="stockShareCloseBtn" type="button" aria-label="关闭个股分享面板">×</button>
      </div>
      <p>输入部分代码就会联想，例如输入“600”；选择“看盘”查看分时和多周期K线，选择“分享”立即得到手机链接。</p>
      <div class="stock-share-search"><input id="stockShareSearchInput" type="search" placeholder="输入 600、601168 或股票名称" autocomplete="off" inputmode="search"><button id="stockShareSearchBtn" type="button">搜索</button></div>
      <div class="stock-share-results" id="stockShareResults"><div class="stock-share-empty">输入代码或名称开始搜索<div class="stock-share-prefixes"><button type="button" data-stock-prefix="600">600</button><button type="button" data-stock-prefix="601">601</button><button type="button" data-stock-prefix="300">300</button><button type="button" data-stock-prefix="688">688</button></div></div></div>
      <span class="share-snapshot-status" id="stockShareStatus" aria-live="polite"></span>
    </section>
  </div>

  <script src="./xlsx.full.min.js"></script>
  <script src="./echarts.min.js?v=5.5.0"></script>
  <script src="./portfolio_analysis_workbench.js?v=20260906-stock-analysis-v84"></script>

</body>
</html>
